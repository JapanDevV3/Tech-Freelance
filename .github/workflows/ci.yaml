name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

# A newer push to the same branch cancels the older, now-irrelevant run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine # same as docker-compose
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-a-real-secret # throwaway value; real secrets live in Vercel env
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Migrations apply on a fresh database
        run: npm run db:migrate
      - name: Build
        run: npm run build
